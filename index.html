<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Rainy By Window BG – Test Demo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d0f14; color: #d8dce6; font: 13px/1.4 system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  #stage.checker { background: repeating-conic-gradient(#222 0 25%, #2c2c2c 0 50%) 0 0 / 16px 16px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #hud { position: absolute; top: 8px; left: 8px; background: #000a; padding: 6px 10px; border-radius: 6px; font: 12px monospace; pointer-events: none; white-space: pre; }
  #panel { width: 340px; background: #161a22; border-left: 1px solid #2a3040; overflow-y: auto; padding: 12px; }
  h2 { font-size: 14px; margin: 14px 0 6px; color: #9fb3ff; border-bottom: 1px solid #2a3040; padding-bottom: 4px; }
  h2:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; flex-wrap: wrap; }
  .row label { flex: 1; }
  button { background: #2a3350; color: #fff; border: 1px solid #3d4a70; padding: 4px 9px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  button:hover { background: #3a4670; }
  button.on { background: #4b63c9; }
  select, input[type=number] { background: #0d0f14; color: #fff; border: 1px solid #3d4a70; border-radius: 4px; padding: 2px 4px; }
  input[type=range] { width: 100%; }
  .layer { display: grid; grid-template-columns: 18px 1fr 70px; gap: 4px; align-items: center; padding: 3px 0; border-bottom: 1px dashed #222838; }
  .layer .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer .blend { grid-column: 2 / 4; display: flex; gap: 4px; }
  .layer .blend select { flex: 1; font-size: 11px; }
  .layer .blend input { width: 70px; }
  .muted { color: #7a8299; font-size: 11px; }
  kbd { background: #2a3040; border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas><div id="hud"></div></div>

<div id="panel">
  <h2>Nguồn</h2>
  <div class="row">
    <button id="srcLayers" class="on">Layers 320x180</button>
    <button id="srcFullHD">FullHD sequence</button>
  </div>

  <h2>Playback</h2>
  <div class="row">
    <button id="play">⏸ Pause</button>
    <button id="prev">◀ Frame</button>
    <button id="next">Frame ▶</button>
    <button id="thunder">⚡ Thunder</button>
  </div>
  <div class="row">
    <label>Chế độ</label>
    <select id="mode">
      <option value="auto">Main loop + thunder ngẫu nhiên</option>
      <option value="main">Main loop (9–43)</option>
      <option value="thunder">Thunder loop (1–8)</option>
      <option value="all">Toàn bộ (1–43)</option>
    </select>
  </div>
  <div class="row"><label>Thunder ngẫu nhiên mỗi (giây)</label>
    <input type="number" id="thMin" value="4" min="1" style="width:46px"> –
    <input type="number" id="thMax" value="10" min="1" style="width:46px"></div>
  <div class="row"><label>Tốc độ: <span id="speedV">1.00x</span></label></div>
  <input type="range" id="speed" min="0.1" max="4" step="0.05" value="1">
  <div class="row"><label>Frame: <span id="frameV">0</span></label></div>
  <input type="range" id="scrub" min="0" max="42" step="1" value="0">

  <h2>Hiển thị</h2>
  <div class="row"><label>Scale</label>
    <select id="scale">
      <option value="fit">Fit (integer)</option>
      <option value="fill">Fill màn hình (không integer)</option>
      <option value="1">1x</option><option value="2">2x</option><option value="3">3x</option>
      <option value="4">4x</option><option value="6">6x</option>
    </select></div>
  <div class="row"><label><input type="checkbox" id="smooth"> Smoothing (tắt = pixel nét)</label></div>
  <div class="row"><label><input type="checkbox" id="checker"> Nền caro (soi alpha)</label></div>
  <div class="row"><label><input type="checkbox" id="hudChk" checked> HUD / FPS</label></div>
  <div class="row"><label><input type="checkbox" id="parallax"> Parallax theo chuột (test)</label></div>
  <div class="row">
    <button id="shot">📷 Chụp PNG</button>
    <button id="fs">⛶ Fullscreen</button>
  </div>

  <div id="layerSec">
    <h2>Layers</h2>
    <div class="row">
      <button id="allOn">Bật hết</button>
      <button id="allOff">Tắt hết</button>
      <button id="resetBlend">Reset blend</button>
    </div>
    <div class="muted">Click tên để solo layer. Alt+click để bỏ solo.</div>
    <div id="layers"></div>
  </div>

  <h2>Phím tắt</h2>
  <div class="muted">
    <kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> frame · <kbd>T</kbd> thunder ·
    <kbd>1</kbd>–<kbd>9</kbd>,<kbd>0</kbd> bật/tắt layer · <kbd>S</kbd> chụp · <kbd>F</kbd> fullscreen · <kbd>+</kbd>/<kbd>-</kbd> tốc độ
  </div>
</div>

<script>
const BASE = 'assets/rainyByWindowBG_byFadingPixels/';
const W = 320, H = 180, FRAMES = 43, DEFAULT_DUR = 100;
const THUNDER = [0, 7], MAIN = [8, 42]; // theo ReadMe: thunder 1-8, main 9-43

const BLENDS = ['source-over','multiply','screen','overlay','soft-light','hard-light','lighten','darken','color-dodge','color-burn','lighter','difference'];
const LAYER_DEFS = [
  ['layer0_BG', 'source-over'],
  ['layer1_tree0', 'source-over'],
  ['layer2_lightning', 'source-over'],
  ['layer3_tree1', 'source-over'],
  ['layer4_rain0', 'source-over'],
  ['layer5_tree2', 'source-over'],
  ['layer6_rain1', 'source-over'],
  ['layer7_tree3', 'source-over'],
  ['layer8_rain2', 'source-over'],
  ['layer9_window', 'source-over'],
  ['layer10_bookshelf', 'source-over'],
  ['layer11_candle', 'source-over'],
  ['layer12_candleVFX_SoftLight_BlendingMode', 'soft-light'],
  ['layer13_candleVFX_HardLight_BlendingMode', 'hard-light'],
  ['layer14_fire', 'source-over'],
  ['layer15_thunderVFX_Multiply_BlendMode', 'multiply'],
  ['layer16_thunderVFX_Screen_BlendMode', 'screen'],
];

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const buf = document.createElement('canvas');
buf.width = W; buf.height = H;
const bctx = buf.getContext('2d');
const $ = id => document.getElementById(id);

const state = {
  source: 'layers', playing: true, speed: 1, frame: MAIN[0], acc: 0,
  mode: 'auto', thunderActive: false, nextThunderAt: 0, solo: null,
  mouseX: 0, mouseY: 0,
};

// ---------- loading ----------
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(src); i.src = src; });
}
async function loadJson(src) {
  try { const r = await fetch(src); return r.ok ? await r.json() : null; } catch { return null; } // file:// sẽ fail -> dùng lưới mặc định
}
function defaultFrames() {
  return Array.from({ length: FRAMES }, (_, i) => ({ x: i * W, y: 0, w: W, h: H, dur: DEFAULT_DUR }));
}

const layers = [];
let durations = Array(FRAMES).fill(DEFAULT_DUR);
let fullHD = null;

async function loadLayers() {
  const dir = BASE + 'GameDev_Assets_320x180/';
  const res = await Promise.all(LAYER_DEFS.map(async ([name, blend]) => {
    const [img, json] = await Promise.all([loadImg(dir + name + '.png'), loadJson(dir + name + '.json')]);
    const frames = json ? json.frames.map(f => ({ ...f.frame, dur: f.duration })) : defaultFrames();
    return { name, img, frames, blend, defBlend: blend, opacity: 1, visible: true, json: !!json };
  }));
  layers.push(...res);
  durations = layers[0].frames.map(f => f.dur);
}

async function loadFullHD() {
  if (fullHD) return fullHD;
  hud(`Đang tải FullHD sequence...`);
  const dir = BASE + 'FullHD_imagesSequence/rainyByWindow_FullHD';
  fullHD = await Promise.all(Array.from({ length: FRAMES }, (_, i) => loadImg(dir + (i + 1) + '.png')));
  return fullHD;
}

// ---------- UI ----------
function buildLayerUI() {
  const box = $('layers');
  box.innerHTML = '';
  layers.forEach((L, i) => {
    const el = document.createElement('div');
    el.className = 'layer';
    el.innerHTML = `
      <input type="checkbox" ${L.visible ? 'checked' : ''}>
      <span class="name" title="${L.name}">${i}. ${L.name.replace(/^layer\d+_/, '')}</span>
      <input type="range" min="0" max="1" step="0.05" value="${L.opacity}" title="Opacity">
      <div class="blend"><select>${BLENDS.map(b => `<option ${b === L.blend ? 'selected' : ''}>${b}</option>`).join('')}</select></div>`;
    const [chk, name, op] = el.querySelectorAll('input, .name');
    chk.onchange = () => { L.visible = chk.checked; };
    op.oninput = () => { L.opacity = +op.value; };
    el.querySelector('select').onchange = e => { L.blend = e.target.value; };
    name.style.cursor = 'pointer';
    name.style.color = state.solo === i ? '#ffd56b' : '';
    name.onclick = e => { state.solo = (e.altKey || state.solo === i) ? null : i; buildLayerUI(); };
    box.appendChild(el);
  });
}

function setSource(src) {
  state.source = src;
  $('srcLayers').classList.toggle('on', src === 'layers');
  $('srcFullHD').classList.toggle('on', src === 'fullhd');
  $('layerSec').style.display = src === 'layers' ? '' : 'none';
  if (src === 'fullhd') loadFullHD().then(resize); else resize();
}

function range() {
  if (state.mode === 'thunder' || (state.mode === 'auto' && state.thunderActive)) return THUNDER;
  if (state.mode === 'all') return [0, FRAMES - 1];
  return MAIN;
}

function scheduleThunder(now) {
  const a = Math.max(1, +$('thMin').value), b = Math.max(a, +$('thMax').value);
  state.nextThunderAt = now + (a + Math.random() * (b - a)) * 1000;
}

function triggerThunder() {
  if (state.mode !== 'auto') state.mode = $('mode').value = 'auto';
  state.thunderActive = true;
  state.frame = THUNDER[0];
  state.acc = 0;
}

function step(dir) {
  const [a, b] = range();
  let f = state.frame + dir;
  if (f > b) {
    if (state.mode === 'auto' && state.thunderActive) { state.thunderActive = false; f = MAIN[0]; scheduleThunder(performance.now()); }
    else f = a;
  } else if (f < a) f = b;
  state.frame = f;
}

// ---------- render ----------
let scale = 1, dpr = 1;
function resize() {
  const stage = $('stage');
  dpr = window.devicePixelRatio || 1;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const mode = $('scale').value;
  let cw, ch;
  if (mode === 'fill') { const s = Math.min(sw / W, sh / H); cw = W * s; ch = H * s; }
  else {
    scale = mode === 'fit' ? Math.max(1, Math.floor(Math.min(sw * dpr / W, sh * dpr / H))) : +mode;
    cw = W * scale / dpr; ch = H * scale / dpr;
  }
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
}

function drawLayers(f) {
  bctx.globalCompositeOperation = 'source-over';
  bctx.globalAlpha = 1;
  bctx.clearRect(0, 0, W, H);
  const px = $('parallax').checked;
  layers.forEach((L, i) => {
    const show = state.solo !== null ? state.solo === i : L.visible;
    if (!show || L.opacity <= 0) return;
    const fr = L.frames[f] || L.frames[0];
    // parallax: layer càng sau (index nhỏ, trước window=9) càng dịch nhiều
    let ox = 0, oy = 0;
    if (px && i < 9) { const d = (9 - i) * 0.6; ox = Math.round(-state.mouseX * d); oy = Math.round(-state.mouseY * d * 0.5); }
    bctx.globalCompositeOperation = L.blend;
    bctx.globalAlpha = L.opacity;
    bctx.drawImage(L.img, fr.x, fr.y, fr.w, fr.h, ox, oy, fr.w, fr.h);
  });
  bctx.globalCompositeOperation = 'source-over';
  bctx.globalAlpha = 1;
}

function draw() {
  ctx.imageSmoothingEnabled = $('smooth').checked;
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (state.source === 'fullhd') {
    if (fullHD) ctx.drawImage(fullHD[state.frame], 0, 0, cv.width, cv.height);
  } else {
    drawLayers(state.frame);
    ctx.drawImage(buf, 0, 0, cv.width, cv.height);
  }
}

// ---------- loop ----------
let last = performance.now(), fpsT = 0, fpsN = 0, fps = 0;
function hud(text) { $('hud').textContent = text; }
function tick(now) {
  const dt = now - last; last = now;
  fpsN++; fpsT += dt; if (fpsT >= 500) { fps = fpsN * 1000 / fpsT; fpsN = fpsT = 0; }

  if (state.playing) {
    if (state.mode === 'auto' && !state.thunderActive && now >= state.nextThunderAt) triggerThunder();
    state.acc += dt * state.speed;
    let guard = 0;
    while (state.acc >= durations[state.frame] && guard++ < 100) { state.acc -= durations[state.frame]; step(1); }
  }
  draw();

  $('frameV').textContent = `${state.frame + 1} / ${FRAMES}`;
  $('scrub').value = state.frame;
  $('hud').style.display = $('hudChk').checked ? '' : 'none';
  if ($('hudChk').checked) {
    const [a, b] = range();
    hud(`src: ${state.source}  mode: ${state.mode}${state.thunderActive ? ' (⚡)' : ''}
frame: ${state.frame + 1}/${FRAMES}  range: ${a + 1}-${b + 1}
fps: ${fps.toFixed(0)}  speed: ${state.speed.toFixed(2)}x
canvas: ${cv.width}x${cv.height}  scale: ${(cv.width / W).toFixed(2)}x
json: ${layers.length && layers[0].json ? 'loaded' : 'fallback grid'}${state.solo !== null ? `\nsolo: ${layers[state.solo].name}` : ''}`);
  }
  requestAnimationFrame(tick);
}

// ---------- events ----------
function togglePlay() { state.playing = !state.playing; $('play').textContent = state.playing ? '⏸ Pause' : '▶ Play'; }
function setSpeed(v) { state.speed = Math.min(4, Math.max(0.1, v)); $('speed').value = state.speed; $('speedV').textContent = state.speed.toFixed(2) + 'x'; }
function screenshot() {
  const a = document.createElement('a');
  a.download = `rainyBG_frame${state.frame + 1}.png`;
  a.href = cv.toDataURL('image/png');
  a.click();
}

$('srcLayers').onclick = () => setSource('layers');
$('srcFullHD').onclick = () => setSource('fullhd');
$('play').onclick = togglePlay;
$('prev').onclick = () => { if (state.playing) togglePlay(); step(-1); };
$('next').onclick = () => { if (state.playing) togglePlay(); step(1); };
$('thunder').onclick = triggerThunder;
$('mode').onchange = e => {
  state.mode = e.target.value; state.thunderActive = false;
  const [a, b] = range(); if (state.frame < a || state.frame > b) state.frame = a;
  scheduleThunder(performance.now());
};
$('speed').oninput = e => setSpeed(+e.target.value);
$('scrub').oninput = e => { if (state.playing) togglePlay(); state.frame = +e.target.value; };
$('scale').onchange = resize;
$('checker').onchange = e => $('stage').classList.toggle('checker', e.target.checked);
$('shot').onclick = screenshot;
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('stage').requestFullscreen();
$('allOn').onclick = () => { layers.forEach(l => l.visible = true); state.solo = null; buildLayerUI(); };
$('allOff').onclick = () => { layers.forEach(l => l.visible = false); state.solo = null; buildLayerUI(); };
$('resetBlend').onclick = () => { layers.forEach(l => { l.blend = l.defBlend; l.opacity = 1; }); buildLayerUI(); };
$('stage').onmousemove = e => {
  const r = $('stage').getBoundingClientRect();
  state.mouseX = (e.clientX - r.left) / r.width - 0.5;
  state.mouseY = (e.clientY - r.top) / r.height - 0.5;
};
window.addEventListener('resize', resize);
document.addEventListener('fullscreenchange', () => setTimeout(resize, 50));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); togglePlay(); }
  else if (k === 'arrowright') { if (state.playing) togglePlay(); step(1); }
  else if (k === 'arrowleft') { if (state.playing) togglePlay(); step(-1); }
  else if (k === 't') triggerThunder();
  else if (k === 's') screenshot();
  else if (k === 'f') $('fs').click();
  else if (k === '+' || k === '=') setSpeed(state.speed + 0.25);
  else if (k === '-') setSpeed(state.speed - 0.25);
  else if (/^[0-9]$/.test(k)) {
    const i = k === '0' ? 9 : +k - 1;
    if (layers[i]) { layers[i].visible = !layers[i].visible; buildLayerUI(); }
  }
});

// ---------- start ----------
hud('Đang tải layers...');
loadLayers().then(() => {
  buildLayerUI();
  resize();
  scheduleThunder(performance.now());
  requestAnimationFrame(tick);
}).catch(src => hud('Lỗi tải: ' + src));
</script>
</body>
</html>
